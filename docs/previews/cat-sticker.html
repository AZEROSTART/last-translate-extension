<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>贴纸猫 · 照片贴纸收录特效</title>
    <style>
      :root {
        --bg: #f3f2ef;
        --panel: #ffffff;
        --text: #1f2328;
        --muted: #6e7781;
        --line: rgba(0, 0, 0, 0.12);
        --accent-ink: #0f766e;
        color-scheme: light;
      }
      html[data-theme="dark"] {
        --bg: #0f1318;
        --panel: #1a2027;
        --text: #e6edf3;
        --muted: #9aa4af;
        --line: rgba(255, 255, 255, 0.14);
        --accent-ink: #5eead4;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 32px 24px 64px;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      }
      .page { max-width: 1040px; margin: 0 auto; }
      h1 { margin: 0 0 4px; font-size: 20px; }
      .sub { margin: 0 0 20px; color: var(--muted); font-size: 12.5px; max-width: 78ch; }
      .toolbar { display: flex; gap: 8px; margin-bottom: 20px; }
      button {
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--text);
        border-radius: 8px;
        padding: 6px 12px;
        font: inherit;
        font-size: 12.5px;
        cursor: pointer;
      }
      .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
      .cell {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 16px 12px;
      }
      .cell h2 { margin: 0 0 2px; font-size: 13px; }
      .cell p { margin: 0 0 10px; color: var(--muted); font-size: 11.5px; }
      .row { display: flex; align-items: flex-end; gap: 18px; }
      .stage { display: flex; flex-direction: column; align-items: center; gap: 6px; }
      .stage span { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
      .frame { display: flex; align-items: flex-end; justify-content: center; }
      .frame.big { width: 240px; height: 244px; }
      .frame.big .cat { --w: 216px; }
      .frame.mid { width: 88px; height: 86px; }
      .frame.small { width: 70px; height: 68px; }

      /* ---- the effect itself (mirrors src/content/effects/cat-sticker.ts) ---- */
      .cat {
        --w: 80px;
        position: relative;
        display: block;
        width: var(--w);
      }
      .cat .fx-img {
        display: block;
        width: 100%;
        height: auto;
        filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.22)) grayscale(1);
        transition: filter 320ms ease;
        animation: sticker-bob 3.8s ease-in-out infinite;
        -webkit-user-drag: none;
        user-select: none;
      }
      .cat[data-state="peel"] .fx-img,
      .cat[data-state="settled"] .fx-img,
      .cat[data-state="known"] .fx-img {
        filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.22)) grayscale(0);
      }
      .cat .fx-plus {
        position: absolute;
        left: 100%;
        top: 34px;
        transform: translate(2px, -50%);
        color: var(--accent-ink);
        font-size: 10.5px;
        line-height: 1;
        white-space: nowrap;
        opacity: 0;
      }
      .cat[data-state="settled"] .fx-img { animation: none; transform: none; }
      .cat[data-state="settled"] .fx-plus { animation: sticker-plus 1100ms ease-out forwards; }
      .cat[data-state="known"] .fx-img {
        animation: none;
        transform: translateY(1px);
      }
      .cat[data-state="peel"] .fx-img { animation: none; transform: translateY(-9px) rotate(-5deg) scale(1.04); }
      .cat[data-state="play"] .fx-img { animation: sticker-peel 720ms cubic-bezier(0.34, 0.7, 0.36, 1) both; }

      @keyframes sticker-bob {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-2px) rotate(-0.7deg); }
      }
      @keyframes sticker-peel {
        0% { transform: translateY(0) rotate(0deg) scale(1); }
        18% { transform: translateY(-7px) rotate(-4deg) scale(1.03); }
        36% { transform: translateY(-9px) rotate(-5deg) scale(1.04); }
        56% { transform: translateY(2px) rotate(1deg) scale(1.02, 0.96); }
        74% { transform: translateY(-1px) rotate(-0.5deg) scale(0.99, 1.01); }
        100% { transform: translateY(0) rotate(0deg) scale(1); }
      }
      @keyframes sticker-plus {
        0% { opacity: 0; transform: translate(2px, -42%) scale(0.85); }
        22% { opacity: 1; transform: translate(2px, -52%) scale(1.04); }
        78% { opacity: 1; transform: translate(2px, -58%) scale(1); }
        100% { opacity: 0; transform: translate(2px, -68%) scale(1); }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <h1>贴纸猫 · 照片贴纸收录特效</h1>
      <p class="sub">
        真照片抠图（macOS Vision 前景分割）+ 烘焙的白色 die-cut 描边，转成 8.6KB 的 WebP 内联进 bundle。
        左边 2.7× 看毛边，右边是卡片里的 80px 与 64px。设置页名「贴纸猫」。
      </p>
      <div class="toolbar">
        <button id="theme">切换明暗</button>
        <button id="play">播放一次收录</button>
      </div>
      <div class="grid" id="grid"></div>
    </div>

    <template id="cat-tpl">
      <img class="fx-img" src="../../src/content/effects/assets/cat-held.webp" alt="" />
    </template>

    <script>
      const tpl = document.getElementById("cat-tpl");
      const grid = document.getElementById("grid");
      const states = [
        ["idle", "悬停：还没收录，贴纸是灰的，轻轻起伏"],
        ["peel", "点击中：掀起来，同时开始上色（720ms 的第 36%）"],
        ["settled", "落定：整只猫上色并拍回卡片，右侧淡入 +1 已收录"],
        ["known", "已收过：保持彩色，安静地待在词下面"],
      ];
      grid.innerHTML = states
        .map(
          ([state, title]) => `
        <div class="cell">
          <h2>${state}</h2>
          <p>${title}</p>
          <div class="row">
            <div class="stage"><div class="frame big"><div class="cat" data-state="${state}"></div></div><span>2.7×</span></div>
            <div class="stage"><div class="frame mid"><div class="cat" data-state="${state}"></div></div><span>80px</span></div>
            <div class="stage"><div class="frame small"><div class="cat" data-state="${state}" style="--w:64px"></div></div><span>64px</span></div>
          </div>
        </div>`,
        )
        .join("");
      for (const node of grid.querySelectorAll(".cat")) {
        node.appendChild(tpl.content.cloneNode(true));
        const plus = document.createElement("span");
        plus.className = "fx-plus";
        plus.textContent = "+1 已收录";
        node.appendChild(plus);
      }

      document.getElementById("theme").addEventListener("click", () => {
        const html = document.documentElement;
        html.dataset.theme = html.dataset.theme === "dark" ? "light" : "dark";
      });
      document.getElementById("play").addEventListener("click", () => {
        for (const node of grid.querySelectorAll('.cat[data-state="settled"]')) {
          node.dataset.state = "play";
          setTimeout(() => (node.dataset.state = "settled"), 760);
        }
      });
    </script>
  </body>
</html>
