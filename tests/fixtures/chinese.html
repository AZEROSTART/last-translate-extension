<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>中文测试页面</title>
  </head>
  <body>
    <header>
      <h1>一段完全由中文写成的文章</h1>
    </header>
    <main id="zh-article">
      <p id="zh-p1" class="zh-paragraph">
        第一段文字用来确认内容脚本不会把已经翻译好的页面再次送去翻译。
      </p>
      <p id="zh-p2" class="zh-paragraph">
        第二段文字继续描述一个安静的午后，窗外的树叶轻轻摇动。
      </p>
      <p id="zh-p3" class="zh-paragraph">
        第三段文字提到桌上的茶杯，以及一本翻到中间的书。
      </p>
      <p id="zh-p4" class="zh-paragraph">
        第四段文字记录了几声远处的鸟鸣，然后一切都安静下来。
      </p>
      <p id="zh-p5" class="zh-paragraph">
        最后一段文字结束这篇文章，没有留下任何需要翻译的英文句子。
      </p>
    </main>
  </body>
</html>
